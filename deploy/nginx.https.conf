server { listen 80; server_name _; return 301 https://$host$request_uri; }
server {
 listen 443 ssl;
 server_name _;
 ssl_certificate /etc/nginx/certs/fullchain.pem;
 ssl_certificate_key /etc/nginx/certs/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 root /usr/share/nginx/html;
 client_max_body_size 201m;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 location /api/ { proxy_pass http://api:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $remote_addr; proxy_read_timeout 180s; proxy_request_buffering off; }
 location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
 location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
}
