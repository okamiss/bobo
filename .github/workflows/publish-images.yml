name: Publish application images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Alibaba Cloud ACR
        shell: bash
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          set +x
          for attempt in 1 2 3 4 5; do
            if printf '%s' "$ACR_PASSWORD" | docker login \
              --username "$ACR_USERNAME" \
              --password-stdin \
              "$ACR_REGISTRY"; then
              exit 0
            fi
            if [[ "$attempt" -lt 5 ]]; then
              echo "ACR login attempt $attempt failed; retrying in 10 seconds."
              sleep 10
            fi
          done
          echo 'Unable to reach or authenticate with ACR after 5 attempts.' >&2
          exit 1

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          # ACR Personal Edition rejects OCI attestation manifests.
          provenance: false
          sbom: false
          tags: |
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/bobo-api:latest
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/bobo-api:${{ github.sha }}
          cache-from: type=gha,scope=bobo-api
          cache-to: type=gha,mode=max,scope=bobo-api

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/bobo-web:latest
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/bobo-web:${{ github.sha }}
          cache-from: type=gha,scope=bobo-web
          cache-to: type=gha,mode=max,scope=bobo-web
